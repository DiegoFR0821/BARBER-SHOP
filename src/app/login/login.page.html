<ion-content [fullscreen]="true" class="mobile-bg-content">
  
  <div class="app-screen-wrapper">
    
    <div class="nav-header-floating">
      <ion-buttons slot="start">
        <ion-back-button defaultHref="/home" text="" class="back-btn-gold"></ion-back-button>
      </ion-buttons>
    </div>

    <div class="brand-brandup">
      <h1 class="brand-logo-text">ÉTNICA</h1>
      <h3 class="brand-sub-text">SALÓN</h3>
    </div>

    <div class="form-card-mobile">
      <h2 class="form-title">Iniciar Sesión</h2>
      <p class="form-subtitle">Bienvenido de vuelta. Ingresa tus datos para acceder a tu espacio de relajación y belleza.</p>

      <div class="input-custom-holder">
        <ion-item lines="none" class="input-premium-item">
          <ion-input 
            label="Correo Electrónico" 
            labelPlacement="floating" 
            type="email"
            [(ngModel)]="credenciales.correo">
          </ion-input>
        </ion-item>
      </div>

      <div class="input-custom-holder">
        <ion-item lines="none" class="input-premium-item">
          <ion-input 
            label="Contraseña" 
            labelPlacement="floating" 
            type="password"
            [(ngModel)]="credenciales.password">
          </ion-input>
        </ion-item>
      </div>

      <ion-text color="danger" *ngIf="mensajeError">
        <p class="error-msg-text">⚠️ {{ mensajeError }}</p>
      </ion-text>

      <ion-button expand="block" class="btn-gold-submit" (click)="iniciarSesion()" [disabled]="cargando">
        {{ cargando ? 'INGRESANDO...' : 'LOG IN' }}
      </ion-button>

      <ion-button expand="block" fill="clear" class="btn-link-registro" (click)="irARegistro()">
        ¿No tienes una cuenta? Regístrate aquí
      </ion-button>
    </div>

  </div>

</ion-content>
