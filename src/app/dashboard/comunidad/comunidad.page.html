<ion-header class="ion-no-border header-dark-barber">
  <ion-toolbar style="--background: #0b0b0d; padding: 6px 0; border-bottom: 1px solid rgba(197, 157, 95, 0.15);">
    <ion-title style="font-weight: 800; color: #ffffff; font-size: 15px; text-align: center; display: flex; align-items: center; justify-content: center; gap: 8px;">
      <ion-icon name="people-outline" style="color: #c59d5f; font-size: 22px;"></ion-icon>
      COMUNIDAD BARBER SHOP
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="chat-bg">
  <div class="chat-container">
    
    <div class="system-message">
      <span>Bienvenido al muro en vivo de Barber Shop Lima Norte S.A.C. ¡Comparte con la comunidad!</span>
    </div>

    <div *ngFor="let msj of mensajes" 
         class="message-wrapper" 
         [ngClass]="msj.esMio ? 'message-mine' : 'message-other'">
      
      <div *ngIf="!msj.esMio" class="avatar-circle">
        {{ (msj.usuario || 'B').charAt(0) | uppercase }}
      </div>

      <div class="message-bubble">
        <span class="message-user" *ngIf="!msj.esMio">
          {{ msj.usuario }}
          <span class="role-badge" *ngIf="msj.rol === 'admin'">STAFF</span>
          <span class="role-badge" *ngIf="msj.rol === 'barbero'">BARBERO</span>
        </span>
        <p class="message-text">{{ msj.texto }}</p>
        <span class="message-time">{{ msj.hora }}</span>
      </div>
    </div>

  </div>
</ion-content>

<ion-footer class="ion-no-border">
  <div class="chat-input-container">
    <ion-item lines="none" class="input-item">
      <ion-input 
        [(ngModel)]="mensajeTexto" 
        (keyup.enter)="enviarMensaje()"
        placeholder="Escribe un mensaje a la comunidad..." 
        type="text">
      </ion-input>
    </ion-item>
    <ion-button fill="clear" class="send-btn" (click)="enviarMensaje()" [disabled]="!mensajeTexto.trim() || enviando">
      <ion-icon slot="icon-only" name="send"></ion-icon>
    </ion-button>
  </div>
</ion-footer>
