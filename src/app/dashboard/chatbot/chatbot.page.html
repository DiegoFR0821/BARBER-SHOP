<ion-header class="ion-no-border header-dark-barber">
  <ion-toolbar style="--background: #0b0b0d; padding: 6px 0; border-bottom: 1px solid rgba(197, 157, 95, 0.15);">
    <ion-title style="font-weight: 800; color: #ffffff; font-size: 15px; text-align: center; display: flex; align-items: center; justify-content: center; gap: 8px;">
      <ion-icon name="sparkles-outline" style="color: #c59d5f; font-size: 18px;"></ion-icon>
      ASISTENTE IA BARBER SHOP
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="chat-bg">
  <div class="chat-container">
    
    <div class="system-message">
      <span>Asistente virtual de Barber Shop Lima Norte S.A.C. Consulta sobre estilos, degradados y barba.</span>
    </div>

    <div *ngFor="let msj of mensajes" 
         class="message-wrapper" 
         [ngClass]="msj.role === 'user' ? 'message-mine' : 'message-ia'">
      
      <div *ngIf="msj.role === 'model'" class="avatar-circle ia-avatar">
        <ion-icon name="sparkles-outline"></ion-icon>
      </div>

      <div class="message-bubble">
        <p class="message-text" [innerHTML]="msj.text | slice:0:500"></p> 
      </div>
    </div>

    <div *ngIf="escribiendo" class="message-wrapper message-ia typing-indicator">
      <div class="avatar-circle ia-avatar"><ion-icon name="sparkles-outline"></ion-icon></div>
      <div class="message-bubble typing-dots">
        <span></span><span></span><span></span>
      </div>
    </div>

  </div>
</ion-content>

<ion-footer class="ion-no-border">
  <div class="chat-input-container">
    <ion-item lines="none" class="input-item">
      <ion-input 
        [(ngModel)]="mensajeTexto" 
        (keyup.enter)="enviarMensaje()"
        placeholder="Pregunta sobre cortes, degradados o barba..." 
        type="text"
        [disabled]="escribiendo">
      </ion-input>
    </ion-item>
    <ion-button fill="clear" class="send-btn" (click)="enviarMensaje()" [disabled]="!mensajeTexto.trim() || escribiendo">
      <ion-icon slot="icon-only" name="send"></ion-icon>
    </ion-button>
  </div>
</ion-footer>
