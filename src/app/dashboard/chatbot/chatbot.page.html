<ion-header class="ion-no-border premium-header">
  <ion-toolbar style="--background: #ffffff; padding: 6px 0;">
    <ion-buttons slot="start">
      <ion-menu-button style="color: #aa8529;"></ion-menu-button>
    </ion-buttons>
    <ion-title style="font-weight: 800; color: #111; font-size: 16px; text-align: center; display: flex; align-items: center; justify-content: center; gap: 8px;">
      <ion-icon name="sparkles-outline" style="color: #aa8529; font-size: 20px;"></ion-icon>
      ASISTENTE MÍA
    </ion-title>
    <ion-buttons slot="end" class="ion-padding-end">
      </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="chat-bg">
  <div class="chat-container">
    
    <div class="system-message">
      <span>Las respuestas son generadas por IA. Confirma disponibilidad agendando tu cita.</span>
    </div>

    <div *ngFor="let msj of mensajes" 
         class="message-wrapper" 
         [ngClass]="msj.role === 'user' ? 'message-mine' : 'message-ia'">
      
      <div *ngIf="msj.role === 'model'" class="avatar-circle ia-avatar">
        <ion-icon name="sparkles-outline"></ion-icon>
      </div>

      <div class="message-bubble">
        <p class="message-text" [innerHTML]="msj.text | slice:0:500"></p> 
        </div>
    </div>

    <div *ngIf="escribiendo" class="message-wrapper message-ia typing-indicator">
      <div class="avatar-circle ia-avatar"><ion-icon name="sparkles-outline"></ion-icon></div>
      <div class="message-bubble typing-dots">
        <span></span><span></span><span></span>
      </div>
    </div>

  </div>
</ion-content>

<ion-footer class="ion-no-border">
  <div class="chat-input-container">
    <ion-item lines="none" class="input-item">
      <ion-input 
        [(ngModel)]="mensajeTexto" 
        (keyup.enter)="enviarMensaje()"
        placeholder="Pregúntale a Mía sobre cortes..." 
        type="text"
        [disabled]="escribiendo">
      </ion-input>
    </ion-item>
    <ion-button fill="clear" class="send-btn" (click)="enviarMensaje()" [disabled]="!mensajeTexto.trim() || escribiendo">
      <ion-icon slot="icon-only" name="send"></ion-icon>
    </ion-button>
  </div>
</ion-footer>
