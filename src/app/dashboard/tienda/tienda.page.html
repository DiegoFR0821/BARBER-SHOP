<ion-header class="ion-no-border header-dark-barber">
  <ion-toolbar style="--background: #0b0b0d; padding: 6px 0; border-bottom: 1px solid rgba(197, 157, 95, 0.15);">
    <ion-title style="font-weight: 800; color: #ffffff; font-size: 15px; text-align: left; padding-left: 12px; letter-spacing: 1px;">
      <span style="color: #c59d5f;">BARBER</span> SHOP &bull; CATÁLOGO
    </ion-title>
    <ion-buttons slot="end" class="ion-padding-end">
      <ion-button (click)="irACarrito()" style="--color: #c59d5f; position: relative;">
        <ion-icon name="cart-outline" style="font-size: 24px;"></ion-icon>
        <ion-badge *ngIf="cantidadCarrito > 0" color="danger" style="position: absolute; top: -2px; right: -2px; font-size: 10px; padding: 3px 5px; border-radius: 50%;">
          {{ cantidadCarrito }}
        </ion-badge>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content style="--background: #0b0b0d;">
  <div class="dashboard-wrapper" style="padding: 16px;">
    
    <ion-searchbar 
      placeholder="Buscar productos..." 
      [(ngModel)]="searchTerm" 
      (ionInput)="filtrarProductos()"
      style="--background: #1c1c21; --color: #ffffff; --placeholder-color: #a1a1aa; --border-radius: 12px; padding: 0 0 16px 0;">
    </ion-searchbar>

    <div *ngIf="productosFiltrados.length === 0" style="text-align: center; margin-top: 30px; color: #a1a1aa;">
      <p style="font-size: 13px; font-weight: 600;">No se encontraron productos en el catálogo.</p>
    </div>

    <ion-grid class="ion-no-padding">
      <ion-row style="margin: 0 -6px;">
        <ion-col size="6" *ngFor="let prod of productosFiltrados" style="padding: 6px;">
          <div class="product-catalog-card" style="background: #1c1c21; border-radius: 12px; border: 1px solid rgba(197,157,95,0.25); overflow: hidden; box-shadow: 0 4px 14px rgba(0,0,0,0.4); display: flex; flex-direction: column; height: 100%;">
            
            <div style="width: 100%; aspect-ratio: 1/1; overflow: hidden; background: #141417; position: relative;">
              <img *ngIf="prod.imagen" [src]="prod.imagen" style="width: 100%; height: 100%; object-fit: cover;" />
              <div *ngIf="!prod.imagen" style="width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; color: #c59d5f;">
                <ion-icon name="image-outline" style="font-size: 30px;"></ion-icon>
              </div>
              <ion-badge *ngIf="prod.stock <= 0" color="danger" style="position: absolute; top: 8px; left: 8px; font-size: 9px; font-weight: bold;">AGOTADO</ion-badge>
            </div>

            <div style="padding: 10px; display: flex; flex-direction: column; flex-grow: 1; justify-content: space-between;">
              <div>
                <h4 style="margin: 0; font-size: 13px; font-weight: 700; color: #ffffff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{ prod.nombre }}</h4>
                <p style="margin: 4px 0 8px; font-size: 11px; color: #a1a1aa; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.3; height: 30px;">
                  {{ prod.descripcion || 'Sin descripción disponible.' }}
                </p>
              </div>
              <div>
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                  <span style="font-size: 13px; font-weight: 800; color: #c59d5f;">S/ {{ prod.precio | number:'1.2-2' }}</span>
                  <span style="font-size: 10px; color: #71717a; font-weight: 600;">Stock: {{ prod.stock }}</span>
                </div>
                <ion-button expand="block" fill="solid" size="small" [disabled]="prod.stock <= 0" style="--background: #c59d5f; --color: #0b0b0d; --border-radius: 8px; font-weight: 800; margin: 0;" (click)="agregarAlCarrito(prod)">
                  AÑADIR
                </ion-button>
              </div>
            </div>

          </div>
        </ion-col>
      </ion-row>
    </ion-grid>
  </div>
</ion-content>
