<ion-content [fullscreen]="true" class="mobile-bg-content">
  
  <div class="app-screen-wrapper">
    
    <div class="nav-header-floating">
      <ion-buttons slot="start">
        <ion-back-button defaultHref="/home" text="" class="back-btn-gold"></ion-back-button>
      </ion-buttons>
    </div>

    <div class="brand-brandup">
      <h1 class="brand-logo-text"><span class="gold-text">BARBER</span> SHOP</h1>
      <h3 class="brand-sub-text">LIMA NORTE S.A.C.</h3>
    </div>

    <div class="form-card-mobile">
      <h2 class="form-title">Crear Cuenta</h2>
      <p class="form-subtitle">Regístrate para agendar citas, elegir tu barbero y acceder a beneficios exclusivos.</p>

      <!-- Campo 1: Nombre Completo -->
      <div class="input-custom-holder">
        <ion-item lines="none" class="input-premium-item">
          <ion-input 
            label="Nombre Completo" 
            labelPlacement="floating" 
            type="text"
            placeholder="Ej. Juan Pérez"
            [(ngModel)]="nombre">
          </ion-input>
        </ion-item>
      </div>

      <!-- Campo 2: Teléfono / WhatsApp -->
      <div class="input-custom-holder">
        <ion-item lines="none" class="input-premium-item">
          <ion-input 
            label="Teléfono / WhatsApp" 
            labelPlacement="floating" 
            type="tel"
            placeholder="999-999-999"
            [(ngModel)]="telefono">
          </ion-input>
        </ion-item>
      </div>

      <!-- Campo 3: Correo Electrónico -->
      <div class="input-custom-holder">
        <ion-item lines="none" class="input-premium-item">
          <ion-input 
            label="Correo Electrónico" 
            labelPlacement="floating" 
            type="email"
            placeholder="ejemplo@correo.com"
            [(ngModel)]="correo">
          </ion-input>
        </ion-item>
      </div>

      <!-- Campo 4: Contraseña -->
      <div class="input-custom-holder">
        <ion-item lines="none" class="input-premium-item">
          <ion-input 
            label="Contraseña" 
            labelPlacement="floating" 
            type="password"
            placeholder="Mínimo 6 caracteres"
            [(ngModel)]="clave">
          </ion-input>
        </ion-item>
      </div>

      <!-- Mensaje de Error -->
      <ion-text color="danger" *ngIf="mensajeError">
        <p class="error-msg-text">⚠️ {{ mensajeError }}</p>
      </ion-text>

      <!-- Botón de Registro Directo -->
      <ion-button expand="block" class="btn-gold-submit" (click)="registrarUsuario()" [disabled]="cargando">
        {{ cargando ? 'REGISTRANDO...' : 'CREAR CUENTA' }}
      </ion-button>

      <ion-button expand="block" fill="clear" class="btn-link-registro" (click)="irALogin()">
        ¿Ya tienes cuenta? Inicia sesión aquí
      </ion-button>
    </div>

  </div>

</ion-content>
