<ion-header class="ion-no-border premium-header">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button class="gold-burger"></ion-menu-button>
    </ion-buttons>
    <ion-title class="clean-title">
      <ion-icon name="shield-checkmark-outline" style="color: #c59d5f; margin-right: 4px; vertical-align: middle;"></ion-icon>
      COMUNIDAD (MODO STAFF)
    </ion-title>
    <ion-buttons slot="end" class="ion-padding-end">
      <ion-avatar style="width: 32px; height: 32px;">
        <div class="header-avatar-placeholder">A</div>
      </ion-avatar>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="chat-bg">
  <div class="chat-container">
    
    <div class="system-message">
      <span>💈 Conectado como Staff Oficial de Barber Shop Lima Norte S.A.C.</span>
    </div>

    <div *ngFor="let msj of mensajes" 
         class="message-wrapper" 
         [ngClass]="msj.esMio ? 'message-mine' : 'message-other'">
      
      <div *ngIf="!msj.esMio" class="avatar-circle">
        {{ (msj.usuario || 'C').charAt(0) | uppercase }}
      </div>

      <div class="message-bubble">
        <div class="bubble-header-row" *ngIf="!msj.esMio">
          <span class="message-user">{{ msj.usuario }}</span>
          <button type="button" class="btn-delete-msg" (click)="eliminarMensaje(msj)" title="Eliminar mensaje">
            <ion-icon name="trash-outline"></ion-icon>
          </button>
        </div>
        <p class="message-text">{{ msj.texto }}</p>
        <span class="message-time">{{ msj.hora }}</span>
      </div>
    </div>

  </div>
</ion-content>

<ion-footer class="ion-no-border">
  <div class="chat-input-container">
    <ion-item lines="none" class="input-item">
      <ion-input 
        [(ngModel)]="mensajeTexto" 
        (keyup.enter)="enviarMensaje()"
        placeholder="Responder a los clientes como Staff Barber..." 
        type="text">
      </ion-input>
    </ion-item>
    <ion-button fill="clear" class="send-btn" (click)="enviarMensaje()" [disabled]="!mensajeTexto.trim() || enviando">
      <ion-icon slot="icon-only" name="send"></ion-icon>
    </ion-button>
  </div>
</ion-footer>
